name: Bug report
description: Something in the app doesn't work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste your Gemini API key** or private chat content here.
        Security problems? Use the **Security** tab → **Report a vulnerability** instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Screenshots or a screen recording help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to the Today tab
        2. Tick "Morning Water"
        3. See the wrong icon
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Today / habits
        - Streaks & freezes
        - AI Coach
        - Ember mascot
        - Home-screen widget
        - Analytics
        - Settings
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 7, Android 14
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: e.g. 1.0.0 or c5ade33
